name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Byte-compile every file (catches truncated sources)
        run: python -m compileall -q tokenviz tests
      - name: Tests
        run: python -m pytest -v
      - name: Run the installed command
        shell: bash
        run: |
          tokenviz --version
          tokenviz "hello world" | grep "Total tokens: 2" >/dev/null
          printf 'a\nb c d\n' | tokenviz --top 1 | grep "Total lines analyzed: 1" >/dev/null
          tokenviz -f examples/system-prompt.txt --json | grep '"total_tokens": 196' >/dev/null
          tokenviz -f examples/system-prompt.txt --budget 200 | grep "Within budget" >/dev/null
          set +e; tokenviz -f examples/system-prompt.txt --budget 150; rc=$?; set -e
          test "$rc" = 3
